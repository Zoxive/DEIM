# Bakeoff arm: DEIM-D-FINE-S on training set variant a.
__include__: [
  './dfine_hgnetv2_s_coco.yml',
  '../base/deim.yml'
]

output_dir: ./outputs/bakeoff_a

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0002
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 132

flat_epoch: 64
no_aug_epoch: 12

train_dataloader:
  total_batch_size: 16
  dataset:
    img_folder: ../coco_bakeoff/images
    ann_file: ../coco_bakeoff/a/_annotations.coco.json
    transforms:
      policy:
        epoch: [4, 64, 120]

  collate_fn:
    mixup_epochs: [4, 64]
    stop_epoch: 120

val_dataloader:
  total_batch_size: 16
