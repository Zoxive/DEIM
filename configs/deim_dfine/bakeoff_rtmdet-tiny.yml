# Bakeoff arm: RTMDet-tiny (engine/rtmdet).
__include__: [
  './bakeoff_d-nohand-rot90-nc.yml',
]

output_dir: ./outputs/bakeoff_rtmdet-tiny

epoches: 16

model: RTMDet
criterion: RTMDetCriterion
postprocessor: RTMDetPostProcessor

RTMDet:
  arch: tiny

RTMDetCriterion:
  weight_dict: {loss_cls: 1.0, loss_bbox: 2.0}
  topk: 13

RTMDetPostProcessor:
  score_thr: 0.001
  nms_pre: 30000
  iou_threshold: 0.65
  max_per_img: 300

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*(?:\.bn\.|bias)).*$'
      weight_decay: 0.
  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.05

clip_max_norm: 10.0
