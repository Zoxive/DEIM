# Bakeoff arm: DEIM-D-FINE-N on training set variant d, fish and board only, RandomRotate90, rebuilt set, AIFI attention in fp32 under AMP.
__include__: [
  './bakeoff_d-nohand-rot90-nc-fp32attn.yml',
]

output_dir: ./outputs/bakeoff_d-nohand-rot90-nc-fp32attn-n

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512
  expansion: 0.34
  depth_mult: 0.5
  fp32_attention: True

DFINETransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2
  num_layers: 3
  eval_idx: -1
  num_points: [6, 6]
