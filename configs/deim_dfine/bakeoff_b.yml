# Bakeoff arm: DEIM-D-FINE-S on training set variant b.
__include__: [
  './dfine_hgnetv2_s_coco.yml',
  '../base/deim.yml'
]

output_dir: ./outputs/bakeoff_b

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0002
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 72

flat_epoch: 36
no_aug_epoch: 9

train_dataloader:
  total_batch_size: 16
  dataset:
    img_folder: ../coco_bakeoff/images
    ann_file: ../coco_bakeoff/b/_annotations.coco.json
    transforms:
      policy:
        epoch: [3, 36, 63]

  collate_fn:
    mixup_epochs: [3, 36]
    stop_epoch: 63

val_dataloader:
  total_batch_size: 16
