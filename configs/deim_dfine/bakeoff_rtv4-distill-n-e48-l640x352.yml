# Bakeoff arm: the N 48-epoch 640x352 landscape arm with DINOv3 feature distillation (RT-DETRv4 style) in epochs 16-47.
# It resumes the same epoch-15 state as its control, with the projector added to that checkpoint.
__include__: [
  './bakeoff_d-nohand-rot90-nc-fp32attn-n-e48-l640x352.yml',
]

output_dir: ./outputs/bakeoff_rtv4-distill-n-e48-l640x352

teacher_model: DINOv3Teacher

DINOv3Teacher:
  model_id: facebook/dinov3-vitb16-pretrain-lvd1689m

HybridEncoder:
  distill_teacher_dim: 768

DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5, loss_mal: 1, loss_distill: 5}
  losses: ['mal', 'boxes', 'local', 'distill']
  distill_adaptive_params:
    enabled: True
    rho: 11
    delta: 1
    default_weight: 20
