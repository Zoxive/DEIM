# Bakeoff arm: DEIM-D-FINE-S on training set variant e.
__include__: [
  './dfine_hgnetv2_s_coco.yml',
  '../base/deim.yml'
]

output_dir: ./outputs/bakeoff_e

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*bn).*$'
      lr: 0.0002
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0004
  betas: [0.9, 0.999]
  weight_decay: 0.0001

epoches: 12

flat_epoch: 6
no_aug_epoch: 1

train_dataloader:
  total_batch_size: 16
  dataset:
    img_folder: ../coco_bakeoff/images
    ann_file: ../coco_bakeoff/e/_annotations.coco.json
    transforms:
      policy:
        epoch: [1, 6, 11]

  collate_fn:
    mixup_epochs: [1, 6]
    stop_epoch: 11

val_dataloader:
  total_batch_size: 16
